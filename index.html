<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एकलव्या ग्रुप के सभी पढ़ाने और पढ़ने वालों का डीटेल्स 

और लक्ष्मण तिवारी उर्फ सुमित प्रजापति की मां की चूत 33 बार</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e6e6e6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        .background-text {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .vijay-sahu {
            font-size: 160px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.04);
            text-transform: uppercase;
            user-select: none;
            text-align: center;
            line-height: 1;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(76, 201, 240, 0.1);
            animation: pulse 10s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            0% {
                opacity: 0.03;
                transform: scale(1);
            }
            100% {
                opacity: 0.07;
                transform: scale(1.03);
            }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            margin-bottom: 30px;
            position: relative;
        }
        
        .header-content {
            background: rgba(30, 30, 46, 0.8);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(76, 201, 240, 0.2);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            color: #4cc9f0;
            text-shadow: 0 0 15px rgba(76, 201, 240, 0.5);
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 1.3rem;
            color: #a5b1c2;
            margin-bottom: 10px;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: rgba(76, 201, 240, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #4cc9f0;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #a5b1c2;
        }
        
        .results-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .result-card {
            background: rgba(30, 30, 46, 0.8);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.4s ease;
            border: 1px solid rgba(76, 201, 240, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4cc9f0, #4361ee);
        }
        
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            border-color: rgba(76, 201, 240, 0.3);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .card-title {
            font-size: 1.3rem;
            color: #4cc9f0;
            font-weight: 600;
        }
        
        .card-number {
            background: rgba(76, 201, 240, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #4cc9f0;
        }
        
        .info-item {
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            padding: 6px 0;
        }
        
        .info-label {
            width: 100px;
            font-weight: bold;
            color: #a5b1c2;
            font-size: 0.9rem;
        }
        
        .info-value {
            flex: 1;
            word-break: break-word;
            color: #e6e6e6;
        }
        
        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #a5b1c2;
            font-size: 0.95rem;
            background: rgba(30, 30, 46, 0.7);
            border-radius: 10px;
        }
        
        .developer {
            color: #4cc9f0;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .results-section {
                grid-template-columns: 1fr;
            }
            
            .vijay-sahu {
                font-size: 100px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .stats {
                gap: 15px;
            }
            
            .stat-item {
                padding: 10px 15px;
            }
            
            .stat-number {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .vijay-sahu {
                font-size: 70px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .card-number {
                margin-top: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="background-text">
        <div class="vijay-sahu">VIJAY SAHU</div>
    </div>
    
    <div class="container">
        <header>
            <div class="header-content">
                <h1>एकलव्या ग्रुप के सभी पढ़ाने और पढ़ने वालों का डीटेल्स</h1>
                <p class="subtitle">लक्ष्मण तिवारी उर्फ सुमित प्रजापति की मां की चूत 33 बार</p>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-number">30+</div>
                        <div class="stat-label">Records</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">15+</div>
                        <div class="stat-label">Users</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">10+</div>
                        <div class="stat-label">Locations</div>
                    </div>
                </div>
            </div>
        </header>
        
        <section class="results-section">
            <!-- Mobile number cards will be dynamically generated -->
        </section>
        
        <footer class="footer">
            <p>Mobile Number Information Display &copy; 2023</p>
            <p>Developer: <span class="developer">@vijaysahu_11</span></p>

    </div>

        // Function to generate mobile number cards
        function generateMobileCards() {
            const resultsSection = document.querySelector('.results-section');
            
            mobileData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'result-card';
                
                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="card-title">${item.name}</h3>
                        <span class="card-number">${item.number}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">User ID:</span>
                        <span class="info-value">${item.userId || 'N/A'}</span>
                    </div>
                    ${item.location ? `
                    <div class="info-item">
                        <span class="info-label">Location:</span>
                        <span class="info-value">${item.location}</span>
                    </div>
                    ` : ''}
                `;
                
                resultsSection.appendChild(card);
            });
        }

        // Add subtle animation to cards on page load
        document.addEventListener('DOMContentLoaded', function() {
            generateMobileCards();
            
            const cards = document.querySelectorAll('.result-card');
            
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });
    </script>
</body>
</html>
